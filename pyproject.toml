[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-crawler"
version = "0.1.0"
description = "Starter foundation for an adaptive distributed web crawler."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "pytest==8.4.1",
  "ruff==0.12.2",
]

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
